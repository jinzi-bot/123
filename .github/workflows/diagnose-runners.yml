name: Diagnose runners

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - run: uname -a

  mac14:
    runs-on: macos-14
    steps:
      - run: xcodebuild -version && uname -m

  mac15:
    runs-on: macos-15
    steps:
      - run: xcodebuild -version && uname -m

  mac15intel:
    runs-on: macos-15-intel
    steps:
      - run: xcodebuild -version && uname -m
